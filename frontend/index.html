<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#000000" />

    <!-- ================= VIEWPORT ================= -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= APP META ================= -->
    <meta name="description" content="UniNotify AI - AI-powered campus event alerts and reminders for students and staff." />
    <meta name="application-name" content="UniNotify AI" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ================= IOS SUPPORT ================= -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniNotify AI" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- ================= FAVICON SAFETY ================= -->
    <link rel="icon" href="/icons/icon-192x192.png" />

    <!-- ================= TITLE ================= -->
    <title>UniNotify AI - Smart Campus Notification System</title>

    <!-- ================= FONTS ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ================= EARLY PWA INSTALL CAPTURE (before React mounts) ================= -->
    <script>
      // Capture beforeinstallprompt for the InstallPrompt component
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
    </script>

    <!-- ================= GLOBAL STYLES ================= -->
    <style>
      body {
        margin: 0;
        overscroll-behavior-y: contain;
        font-family: "Poppins", sans-serif;
        background: #000;
      }

      /* Prevent white flash on load (PWA polish) */
      html, body {
        background-color: #000;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- ================= MAIN APP ================= -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
