# Smart Campus Notification System - Docker Compose
# ================================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ==========================================
  # Frontend (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8000/api}
    container_name: scns-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scns-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # Backend (Node.js API)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scns-backend
    restart: unless-stopped
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # Database
      MONGO_URI: ${MONGO_URI}
      
      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      
      # Email
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      
      # Twilio SMS
      TWILIO_SID: ${TWILIO_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_NUMBER: ${TWILIO_NUMBER}
      
      # Firebase
      FIREBASE_SERVICE_ACCOUNT_KEY_PATH: /app/firebase-service-account-key.json
      
      # AI Providers
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      # Mount Firebase service account (local development)
      - ./backend/firebase-service-account-key.json:/app/firebase-service-account-key.json:ro
      # Persistent storage for uploads
      - scns-uploads:/app/uploads
      # Persistent storage for backups
      - scns-backups:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scns-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: scns-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-uni-notify}
    volumes:
      - scns-mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - scns-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # Redis (for BullMQ job queue)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: scns-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - scns-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - scns-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Nginx Reverse Proxy (Production)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: scns-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - scns-network
    profiles:
      - production

# ==========================================
# Volumes (Persistent Data)
# ==========================================
volumes:
  scns-mongodb-data:
    driver: local
  scns-redis-data:
    driver: local
  scns-uploads:
    driver: local
  scns-backups:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  scns-network:
    driver: bridge
